name: Deploy Pharmacy Receiving to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stamp deployed application version
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          sha = os.environ["GITHUB_SHA"]
          index = Path("index.html")
          source = index.read_text()
          token = "__PHARMFLOW_BUILD_SHA__"
          if source.count(token) != 1:
              raise SystemExit("Expected one PharmFlow build identity token in index.html")
          index.write_text(source.replace(token, sha))
          Path("version.json").write_text('{"sha":"' + sha + '"}\n')
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
