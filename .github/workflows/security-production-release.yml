name: PharmFlow security checks
on:
  push:
    branches: ['security/selective-production-prep-20261028']
  pull_request:
    branches: ['main']
permissions:
  contents: read
jobs:
  source-checks:
    name: PharmFlow security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # resolved official v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Focused offline security and Receiving fixtures
        run: node --test tests/security-source-hardening.test.cjs tests/security-production-artifact.test.cjs tests/security-production-gate.test.cjs tests/receiving-consolidation-review.test.cjs tests/receiving-multi-order-hotfix.test.cjs tests/receiving-duplicate-line-allocation.test.cjs tests/receiving-split-queue.test.cjs tests/sec004-password-parity.test.cjs
      - name: Accepted Receiving release checks
        run: node --test tests/receiving-final-projection.test.cjs tests/receiving-allocation-ui.test.cjs tests/receiving-critical-repair.test.cjs tests/receiving-hydration-lifecycle.test.cjs tests/receiving-live-kpi-event.test.cjs tests/receiving-readiness-recovery.test.cjs tests/receiving-recovery-auth.test.cjs tests/receiving-recovery-sql.test.cjs tests/receiving-simplification.test.cjs tests/receiving-startup-hydration.test.cjs tests/receiving-total-kpi.test.cjs tests/receiving-unassigned-hydration.test.cjs tests/receiving-unknown-default.test.cjs tests/sec001-excel-security.test.cjs tests/sleep-wake-permissions.test.cjs tests/order-toolbar-refactor.test.cjs
      - name: Advisory inventory
        run: npm audit --package-lock-only --ignore-scripts --audit-level=low
      - name: Build without deploying
        run: npm run build
