name: Receiving Active Order RPC Hotfix
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/receiving-active-order-rpc-hotfix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production receiving read
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cloud-workspace.js')
          s = p.read_text()
          needle = 'const rows=await cloudAuthRpc("list_pharmflow_cloud_transactions_v2",{'
          if needle not in s:
              raise SystemExit('v2 call not found')
          s = s.replace(needle, 'const rows=await cloudAuthRpc("list_pharmflow_cloud_transactions_v3",{', 1)
          s = s.replace('p_pharmacy_id:pharmacyId,\n            p_limit:5000', 'p_pharmacy_id:pharmacyId,\n            p_order_numbers:getActiveReceivingOrderNumbers().map(normalizeOrderNumber).filter(Boolean),\n            p_limit:5000', 1)
          p.write_text(s)
          q = Path('index.html')
          h = q.read_text()
          h = h.replace('cloud-workspace.js?v=A_LEDGER_AUTH_20260915_2', 'cloud-workspace.js?v=A_ACTIVE_LEDGER_V3_20260915_2')
          q.write_text(h)
          PY
      - name: Commit production fix
        run: |
          git config user.name "PharmFlow Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add cloud-workspace.js index.html
          git commit -m "Fix receiving ledger 1000 row cap"
          git push
