name: Duty readiness checks
on:
  push:
    branches: ['feature/duty-workflow-staging-20261107']
  pull_request:
    branches: ['main']
permissions:
  contents: read
jobs:
  duty:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Build Staging without deploying
        run: npm run build:preview
        env:
          VERCEL: '1'
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_REF: feature/duty-workflow-staging-20261107
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      - name: Duty, authorization, reports and XLSX
        run: node --test tests/duty-*.test.cjs tests/sleep-wake-permissions.test.cjs
