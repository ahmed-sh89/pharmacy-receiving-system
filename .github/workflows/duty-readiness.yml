name: Duty readiness checks
on:
  push:
    branches: ['release/duty-production-prep-20261105']
  pull_request:
    branches: ['main']
permissions:
  contents: read
jobs:
  duty:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Build release artifact without deploying
        run: npm run build
      - name: Duty, authorization, reports and XLSX
        run: node --test --test-concurrency=1 tests/duty-*.test.cjs tests/sleep-wake-permissions.test.cjs
