name: Accepted improvements release preparation
on:
  push:
    branches: ['release/accepted-improvements-prep-20261028','feature/final-staging-refinements-20261028']
permissions:
  contents: read
jobs:
  release-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Focused selective-release checks
        run: >-
          node --test
          tests/export-v2.test.cjs
          tests/export-v2-scale.test.cjs
          tests/global-items-export.test.cjs
          tests/production-owner-export-prep.test.cjs
          tests/final-refinements-ui.test.cjs
          tests/sleep-wake-permissions.test.cjs
          tests/receiving-report-performance.test.cjs
      - name: Build without deploying
        run: npm run build
