<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="connect-src 'none'"><title>PharmFlow — Email visual acceptance</title><style>
body{margin:0;background:#eaf0f6;color:#173d63;font:14px Arial,sans-serif}header{background:#fff;padding:16px 20px;border-bottom:1px solid #cbddea}h1{font-size:19px;margin:0 0 10px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:8px;border:1px solid #bdd0e1;border-radius:5px;background:#fff;color:#173d63}button{cursor:pointer}main{padding:16px;overflow:auto}iframe{display:block;margin:auto;border:1px solid #cbddea;background:white;height:1500px}#result{display:block;margin-top:10px;white-space:pre-wrap;font-size:12px;line-height:1.5}p{margin:8px 0}.test-frame{position:absolute;left:-10000px;top:0;height:1800px;visibility:hidden}
</style></head><body><header><h1>PharmFlow — Receiving Email · Staging</h1><p>Synthetic examples only. Uses the actual email builder and Copy Email. No database connection.</p><div class="controls"><label>Scenario <select id="scenario"><option value="realistic">Accepted two orders</option><option value="long">Long item names</option><option value="five">All five KPIs</option><option value="large">Large signed totals</option><option value="stress">Large totals + long codes</option><option value="twoIndicators">Two KPIs</option><option value="singleKpi">One KPI</option><option value="zero">Conditional KPIs</option></select></label><label>Compose width <select id="width"><option>480</option><option>420</option><option>560</option><option>640</option><option>880</option></select> px</label><button id="copy">Copy Email</button><button id="checks">Run layout checks</button></div><p>Paste into Outlook Web with Ctrl+V → Keep Source Formatting. Check narrow and expanded compose panes.</p><output id="result">Ready.</output></header><main><iframe id="email" title="Actual clipboard HTML" sandbox="allow-same-origin"></iframe></main><script src="js/orders.js"></script><script src="receiving-email.fixture.js"></script><script>
const scenario=document.querySelector('#scenario'),width=document.querySelector('#width'),frame=document.querySelector('#email'),result=document.querySelector('#result');
function report(kind){const r=buildReceivingEmailAcceptanceReport(kind==='stress'?'large':kind);if(kind==='stress'){r.orderGroups[0].rows[0]['Item Number']='123456789012345';r.orderGroups[0].rows[0]['Received Qty']=123456789;r.orderGroups[1].rows[0]['Ordered Qty']=123456789;}return r;}
function render(){frame.style.width=width.value+'px';frame.srcdoc=buildReceivingEmailClipboardHTML(report(scenario.value));}
scenario.onchange=width.onchange=render;
document.querySelector('#copy').onclick=async()=>{try{const rich=await copyFormattedReceivingEmail(report(scenario.value));result.textContent=rich?'Copied HTML + plain text. Ready to paste into Outlook.':'Plain-text fallback: browser did not allow rich clipboard.';}catch(e){result.textContent='Copy failed: '+e.message;}};
async function check(kind,w){const f=document.createElement('iframe');f.className='test-frame';f.style.width=w+'px';f.setAttribute('sandbox','allow-same-origin');const loaded=new Promise(resolve=>f.onload=resolve);f.srcdoc=buildReceivingEmailClipboardHTML(report(kind));document.body.append(f);await loaded;const d=f.contentDocument,issues=[];const details=[...d.querySelectorAll('thead')].map(h=>h.closest('table'));for(const t of details){const b=t.getBoundingClientRect();if(b.left< -1||b.right>w+1)issues.push('table overflow');for(const tr of t.querySelectorAll('tbody>tr')){if(tr.children.length!==6)continue;for(const cell of tr.children){const r=cell.getBoundingClientRect();const range=d.createRange();range.selectNodeContents(cell);for(const text of range.getClientRects())if(text.left<r.left-1||text.right>r.right+1)issues.push('text overlap: '+cell.textContent);if(r.left<b.left-1||r.right>b.right+1)issues.push('cell overflow');}}}for(const card of d.querySelectorAll('table[height="84"]')){const b=card.getBoundingClientRect();if(b.left< -1||b.right>w+1)issues.push('KPI card overflow');for(const cell of card.querySelectorAll('td')){const range=d.createRange();range.selectNodeContents(cell);const b=cell.getBoundingClientRect();for(const r of range.getClientRects())if(r.left<b.left-1||r.right>b.right+1)issues.push('KPI text overflow');}}if(d.documentElement.scrollWidth>w+1)issues.push('document overflow');const statuses=details.flatMap(t=>[...t.querySelectorAll('tbody>tr')].filter(t=>t.children.length===6).map(t=>{const range=d.createRange();range.selectNodeContents(t.children[5]);return [...new Set([...range.getClientRects()].filter(r=>r.width>0).map(r=>Math.round(r.top)))].length;}));f.remove();return `${issues.length?'FAIL':'PASS'} ${w}px · ${kind}${issues.length?' · '+[...new Set(issues)].join('; '):' · all six columns contained'} · status lines ${Math.max(0,...statuses)}`;}
document.querySelector('#checks').onclick=async()=>{result.textContent='Checking…';const rows=[];for(const w of [420,480,560,640,880])for(const kind of ['realistic','long','five','large','stress','twoIndicators','singleKpi','zero']){rows.push(await check(kind,w));result.textContent=rows.join('\n');}result.textContent+='\nActual Outlook paste still requires Product Owner verification.';};render();
</script></body></html>
